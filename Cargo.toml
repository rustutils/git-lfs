[workspace]
resolver = "3"
members = [
    "cli",
    "pointer",
    "store",
    "git",
    "api",
    "transfer",
    "creds",
    "filter",
    "tests/cmd",
    "tests/server",
    "xtask",
]

# strip binaries, and enable LTO to get smaller binaries
[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

# The test server generates an RSA key at startup, which takes seconds
# without optimizations.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3

# profile for even smaller binaries (at the expense of some optimizations)
[profile.small]
inherits = "release"
opt-level = "z"

[workspace.package]
version      = "0.12.0"
edition      = "2024"
rust-version = "1.95"
license      = "MIT"
authors      = ["Patrick Elsen <pelsen@xfbs.net>"]
repository   = "https://gitlab.com/rustutils/git-lfs"
homepage     = "https://rustutils.gitlab.io/git-lfs/"

[workspace.dependencies]
# internal crates, so that consumers can dependen on them with workspace = true
# and we have a single place to set the versions.
git-lfs-pointer  = { path = "pointer",  version = "0.12.0" }
git-lfs-store    = { path = "store",    version = "0.12.0" }
git-lfs-git      = { path = "git",      version = "0.12.0" }
git-lfs-api      = { path = "api",      version = "0.12.0" }
git-lfs-transfer = { path = "transfer", version = "0.12.0" }
git-lfs-creds    = { path = "creds",    version = "0.12.0" }
git-lfs-filter   = { path = "filter",   version = "0.12.0" }

# external crates shared across multiple members.
thiserror      = "2"
aes            = "0.9"
cbc            = "0.2"
md-5           = "0.11"
ruzstd         = "0.9"
rustls         = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
base64         = "0.22"
flate2         = "1"
globset        = "0.4"
tempfile       = "3"
gix-attributes = "0.32"
gix-glob       = "0.25"
bstr           = "1"
clap           = { version = "4", features = ["derive", "string"] }
clap_mangen    = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
sha1        = "0.10"
sha2        = "0.10"
tokio       = { version = "1" }
tokio-util  = { version = "0.7", default-features = false }
futures     = { version = "0.3", default-features = false, features = ["std"] }
reqwest     = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "http2", "stream", "cookies"] }
url         = "2"
wiremock    = "0.6"
