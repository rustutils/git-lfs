stages:
  - lint
  - test
  - package
  - release
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  RUSTUP_HOME: $CI_PROJECT_DIR/.rustup
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: $CI_PROJECT_DIR/.sccache
  SCCACHE_CACHE_SIZE: "2G"
  # Bumping these also invalidates the bin cache, which is keyed on this file.
  CARGO_DEB_VERSION: "3.6.4"
  CARGO_GENERATE_RPM_VERSION: "0.20.0"
  ALPINE_VERSION: "3.23"

# Jobs pick caches with these anchors, because GitLab merges cache lists
# from `extends` unpredictably. target/ and .rustup aren't cached:
# restoring them is no faster than rebuilding target/ with sccache, or
# downloading the toolchain.
.cache-defs:
  cache:
    - &cache-registry
      key:
        files: [Cargo.lock]
      paths:
        - .cargo/registry/cache
        - .cargo/registry/index
    - &cache-bin
      key:
        files: [.gitlab-ci.yml]
      paths:
        - .cargo/bin
        - .cargo/.crates.toml
        - .cargo/.crates2.json
    # One per job, so jobs don't overwrite each other's entries.
    - &cache-sccache
      key: sccache-$CI_JOB_NAME
      paths:
        - .sccache

.rust:
  image: alpine:$ALPINE_VERSION
  cache:
    - *cache-registry
    - *cache-sccache
  before_script:
    - apk add --no-cache build-base bash git rustup sccache
    - rustup-init -y --default-toolchain none --no-modify-path
    - export PATH="$CARGO_HOME/bin:$PATH"
    - rustup show

lint:
  extends: .rust
  stage: lint
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --all --check
    - RUSTDOCFLAGS="-Dwarnings" cargo doc --no-deps --workspace
    - cargo clippy --workspace --all-targets -- -Dwarnings
    # In script, not after_script, so it queries the server cargo used.
    - sccache --show-stats || true

test:
  extends: .rust
  stage: test
  script:
    # Some tests check what happens when a file can't be written, which
    # root always can. The toolchain and caches are in the project
    # directory, so a plain user can run everything from there.
    - apk add --no-cache su-exec
    - adduser -D tester
    - chown -R tester "$CI_PROJECT_DIR"
    - su-exec tester env HOME=/home/tester cargo test --workspace
    - su-exec tester sccache --show-stats || true

# Builds with the rust-version declared in Cargo.toml, so it stays accurate.
msrv:
  extends: .rust
  stage: test
  script:
    - MSRV=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
    - rustup toolchain install "$MSRV" --profile minimal
    - cargo "+$MSRV" check --workspace --all-targets --locked
    - sccache --show-stats || true

package:
  extends: .rust
  stage: package
  cache:
    - *cache-registry
    - *cache-bin
    - *cache-sccache
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    # Lets you test packaging on a branch without tagging.
    - when: manual
      allow_failure: true
  before_script:
    - !reference [.rust, before_script]
    - apk add --no-cache zig zstd just zip tar cargo-zigbuild
    - cargo install --locked --version "$CARGO_DEB_VERSION" cargo-deb
    - cargo install --locked --version "$CARGO_GENERATE_RPM_VERSION" cargo-generate-rpm
  script:
    # Rust newer than 1.94 passes --fix-cortex-a53-843419 when linking for
    # aarch64 musl, which zig rejects. Build with the rust-version from
    # Cargo.toml until cargo-zigbuild filters it out.
    - export RUSTUP_TOOLCHAIN=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
    - rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
    - just package
    - sccache --show-stats || true
  artifacts:
    paths:
      - target/dist/
    # Release pages link to these.
    expire_in: never

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+(-[\w.]+)?$/
  needs:
    - job: package
      artifacts: true
  script:
    - apk add --no-cache ruby
    - ruby scripts/release.rb

# Separate job, so a GitHub failure doesn't fail the GitLab release.
# Needs GITHUB_TOKEN from the rustutils group variables.
release-github:
  stage: release
  image: alpine:$ALPINE_VERSION
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+(-[\w.]+)?$/
  needs:
    - job: package
      artifacts: true
  script:
    - apk add --no-cache ruby github-cli
    - ruby scripts/release_github.rb

pages:
  image: alpine
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - apk add mdbook
    - mdbook build
    - mv target/book public
  artifacts:
    paths:
      - public
