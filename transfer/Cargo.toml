[package]
name                   = "git-lfs-transfer"
description            = "Concurrent transfer queue with HTTPS and pure-SSH adapters for Git LFS uploads and downloads"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme                 = "README.md"
keywords               = ["git", "lfs", "git-lfs", "transfer", "upload"]
categories             = ["web-programming::http-client", "asynchronous"]

[dependencies]
git-lfs-api     = { workspace = true }
git-lfs-creds   = { workspace = true }
git-lfs-store   = { workspace = true }
git-lfs-pointer = { workspace = true }

flate2     = { workspace = true }
futures    = { workspace = true }
reqwest    = { workspace = true }
ruzstd     = "0.9"
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }
tempfile   = { workspace = true }
thiserror  = { workspace = true }
tokio      = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time", "process"] }
tokio-util = { workspace = true, features = ["io", "io-util"] }

[dev-dependencies]
tokio      = { workspace = true, features = ["test-util"] }
url        = { workspace = true }
wiremock   = { workspace = true }
